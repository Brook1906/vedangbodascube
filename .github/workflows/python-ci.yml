name: Python CI

on:
  push:
    branches: [ main, feature-branch ]   # runs on push to these branches
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # If you have a requirements.txt, uncomment the next line:
        # pip install -r requirements.txt

    - name: Run a quick test
      run: |
        echo "Workflow triggered by a push!"
        python --version
        python -c "print('Hello from GitHub Actions')"
        # If you have tests, run them here:
        # python -m pytest
        